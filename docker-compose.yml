# Local development database. Production uses Neon.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: boardgame
      POSTGRES_DB: boardgamegroup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgame -d boardgamegroup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
