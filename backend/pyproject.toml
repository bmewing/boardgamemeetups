[project]
name = "boardgamegroup-api"
version = "0.1.0"
description = "API for organizing board game meetups"
# DigitalOcean Functions' newest Python runtime is 3.13.
requires-python = ">=3.13"
# Only what the deployed function needs; it's exported to functions/ for the build.
dependencies = [
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.161.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
]
migrations = [
    "alembic>=1.20.1",
]

[tool.uv]
package = false
default-groups = ["dev", "migrations"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
